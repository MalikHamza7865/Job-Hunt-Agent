# Render blueprint (https://render.com/docs/blueprint-spec)
# Deploy: push to GitHub -> New -> Blueprint -> select repo, OR
#         render deploy with this file. Free tier sleep/restart on idle is fine:
#         the webhook replies to a user who just messaged, so the app is awake.
services:
  - type: web
    name: job-hunt-webhook
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.webhook_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # PORT is injected by Render automatically.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RECIPIENT_PHONE
        sync: false
      - key: WHATSAPP_TEMPLATE_NAME
        sync: false